<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
<title>Gestão · Lais & Willian</title>
<style>
:root{--bg:#F5EEDF;--card:#FBF8F0;--ink:#453E31;--mut:#6B6153;--g:#627a53;--gd:#3d352c;--gold:#a8744c;--red:#b0533f;--sage:#7f8c73;--tan:#A98F6B;--line:#e6dccb;--soft:#ece2d0}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{font-family:"Poppins",-apple-system,"Segoe UI",sans-serif;font-weight:300;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
a{color:var(--g)}
#login{max-width:340px;margin:12vh auto;background:var(--card);padding:28px;border-radius:16px;border:1px solid var(--line);text-align:center}
#login h2{font-family:"Playfair Display",Georgia,serif;font-weight:400;color:var(--gd)}
#login input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font-size:16px;margin:14px 0 10px;background:#fff}
#login button{width:100%;padding:11px;background:var(--gd);color:#fff;border:0;border-radius:999px;font-size:15px;cursor:pointer}
#err{color:var(--red);min-height:20px;font-size:13px}
.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
aside{background:var(--gd);color:#fff;padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px;overflow-y:auto}
.brand{font-family:"Playfair Display",Georgia,serif;font-size:1.3rem;color:#EFE1CC;letter-spacing:.04em;padding:0 12px 4px}.brand small{display:block;font-family:Poppins;font-weight:300;opacity:.7;font-size:.76rem;margin-top:2px;letter-spacing:0}
.who{margin:14px 0;display:flex;background:rgba(255,255,255,.12);border-radius:10px;padding:3px}
.who button{flex:1;border:0;background:none;color:#fff;padding:7px;border-radius:8px;cursor:pointer;font:inherit;font-size:.82rem}
.who button.on{background:#fff;color:var(--gd);font-weight:500}
.nv{display:flex;gap:12px;align-items:center;border:0;background:none;color:#fff;opacity:.8;padding:11px 12px;border-radius:10px;cursor:pointer;font:inherit;font-size:.92rem;text-align:left;width:100%}
.nv:hover{background:rgba(255,255,255,.08)}.nv.on{background:rgba(255,255,255,.18);opacity:1;font-weight:500}
.nv i{font-style:normal;margin-left:auto;background:var(--red);border-radius:10px;padding:0 7px;font-size:.72rem}
aside .foot{margin-top:auto;font-size:.74rem;opacity:.65;padding:10px 12px 0}
aside .foot button{background:none;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:8px;padding:5px 10px;cursor:pointer;font:inherit;font-size:.76rem;margin:4px 4px 0 0}
.main{min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;padding:18px 32px;background:var(--card);border-bottom:1px solid var(--line);gap:16px;flex-wrap:wrap}
.top h1{font-size:1.7rem;font-family:"Playfair Display",Georgia,serif;font-weight:400;color:var(--gd)}
.top .sub{color:var(--mut);font-size:.82rem}
.cd{display:flex;gap:8px}.cd div{background:var(--bg);border:1px solid var(--line);border-radius:10px;text-align:center;padding:7px 10px;min-width:58px}
.cd b{display:block;font-size:1.35rem;font-weight:400;color:var(--gd);line-height:1.2}.cd small{font-size:.58rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.pg{padding:24px 32px 60px;max-width:1500px}
.grid{display:grid;gap:18px}.k4{grid-template-columns:repeat(4,1fr);margin-bottom:18px}.c2{grid-template-columns:1.4fr 1fr}.c3{grid-template-columns:repeat(3,1fr)}
.card{background:var(--card);border-radius:14px;padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.05);margin-bottom:18px;overflow-x:auto}
.grid>.card,.grid>div>.card:last-child{margin-bottom:0}.grid>div>.card{margin-bottom:18px}.grid>div>.card:last-child{margin-bottom:0}
.card h2{font-size:.76rem;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin-bottom:12px;font-weight:500;display:flex;justify-content:space-between;gap:8px}
.kpi b{font-size:1.9rem;display:block;line-height:1.15;font-weight:400}.kpi span{font-size:.8rem;color:var(--mut)}
.red{color:var(--red)}.gold{color:var(--gold)}.green{color:var(--g)}
.chip{display:inline-block;padding:2px 9px;border-radius:10px;font-size:.72rem;font-weight:500;color:#fff;white-space:nowrap}.soft{background:var(--soft);color:var(--mut)}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);padding:8px 10px;border-bottom:1px solid var(--line);font-weight:500}
td{padding:10px;border-bottom:1px solid #eee5d4;vertical-align:middle;font-size:.88rem}
tr:hover td{background:#f7f1e4}tr:last-child td{border-bottom:0}
.done-t{text-decoration:line-through;opacity:.5}
.chk{width:20px;height:20px;accent-color:var(--g);cursor:pointer;vertical-align:middle}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.filters button,.filters select{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:6px 14px;font:inherit;font-size:.82rem;cursor:pointer;color:var(--ink)}
.filters button.on{background:var(--g);color:#fff;border-color:var(--g)}
.item{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #eee5d4;align-items:center}.item:last-child{border:0}
.item small,.mini{display:block;color:var(--mut);font-size:.76rem;margin-top:2px}
.stack{display:flex;height:18px;border-radius:9px;overflow:hidden;margin:6px 0 12px;background:var(--soft)}
.leg{display:flex;flex-wrap:wrap;gap:12px;font-size:.76rem;color:var(--mut)}.leg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.prog{height:10px;background:var(--soft);border-radius:5px;overflow:hidden;margin:8px 0}.prog i{display:block;height:100%;border-radius:5px;background:var(--g)}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:18px}
.ev{position:relative;margin-bottom:14px}.ev:before{content:"";position:absolute;left:-26px;top:4px;width:12px;height:12px;border-radius:50%;background:var(--c);border:2px solid var(--card)}
.ev .h{font-size:.76rem;font-weight:600;color:var(--c)}.ev .o{font-size:.76rem;color:var(--mut)}
.note{background:#f6ecd0;border-radius:10px;padding:10px 14px;font-size:.8rem;color:#7a5a12;margin-bottom:16px}
.btn{display:inline-block;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font:inherit;font-size:.78rem;cursor:pointer;margin-right:6px;text-decoration:none;color:var(--ink)}
.btn.wa{background:#25a244;color:#fff;border-color:#25a244}
.gift{display:flex;gap:12px;align-items:center}.av{width:42px;height:42px;border-radius:50%;background:#efe5d3;display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex:none}
.cm{display:grid;grid-template-columns:84px 1fr;gap:14px;padding:14px 0;border-bottom:1px solid #eee5d4}.cm:last-child{border:0}
.cm .dt{font-family:"Playfair Display",Georgia,serif;font-size:1.25rem;color:var(--gd);line-height:1.1}.cm .dt small{display:block;font-family:Poppins;font-size:.7rem;color:var(--mut);margin-top:3px}
.cm.late .dt{color:var(--red)}.cm.soon .dt{color:var(--gold)}.cm.ok2{opacity:.65}
.cm details summary{cursor:pointer;color:var(--g);font-size:.8rem;margin-top:6px}
.txtbox{white-space:pre-wrap;background:var(--bg);border-radius:10px;padding:12px;margin:8px 0;font-size:.84rem;line-height:1.55}
.next{background:var(--gd);color:#F5EEDF;border-radius:14px;padding:16px 18px;margin-bottom:18px}
.next small{opacity:.75;text-transform:uppercase;letter-spacing:.06em;font-size:.7rem}.next h3{font-family:"Playfair Display",Georgia,serif;font-weight:400;font-size:1.25rem;margin:3px 0 4px}
.tm{display:inline-block}
.lt{display:flex;overflow-x:auto;padding:10px 4px 6px;position:relative}.lt:before{content:'';position:absolute;left:0;right:0;top:20px;height:3px;background:#d8cdb4}
.lm{flex:0 0 150px;text-align:center;padding:0 8px;position:relative}.lm i{display:block;width:15px;height:15px;border-radius:50%;background:var(--gd);margin:0 auto 8px;border:3px solid var(--card)}
.lm.past{opacity:.5}.lm.near i{background:var(--red)}.lm b{display:block;font-size:.82rem;font-weight:500}.lm span{font-size:.76rem;display:block;line-height:1.25}.lm small{color:var(--mut);font-size:.7rem}
.kan{display:grid;grid-template-columns:repeat(5,minmax(220px,1fr));gap:10px;overflow-x:auto}
.col{background:var(--soft);border-radius:12px;padding:8px;min-height:100px}.col h4{margin:2px 4px 8px;font-size:.8rem;display:flex;justify-content:space-between}
.kc{background:var(--card);border-radius:10px;padding:9px 10px;margin-bottom:8px;border-left:5px solid #999}
details.grp{background:var(--card);border-radius:12px;margin-bottom:12px;overflow:hidden}
details.grp>summary{cursor:pointer;padding:12px 16px;font-weight:500;list-style:none;display:flex;justify-content:space-between;gap:8px}
details.grp>summary::-webkit-details-marker{display:none}details.grp>summary::before{content:'▸';margin-right:8px;color:var(--mut)}details.grp[open]>summary::before{content:'▾'}
details.grp .in{padding:0 16px 12px;overflow-x:auto}
details.n>summary{cursor:pointer;color:var(--g);font-size:.76rem;margin-top:3px}
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#2d2820;color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;z-index:20;display:none}
.mnav{display:none}.cards-m{display:none}.mwho{display:none}
@media(max-width:900px){
 .shell{display:block}aside{display:none}
 .mnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);z-index:5;padding:6px 2px 10px;overflow-x:auto}
 .mnav button{flex:0 0 auto;min-width:72px;border:0;background:none;font:inherit;font-size:.64rem;color:var(--mut);padding:6px 4px;cursor:pointer}
 .mnav button span{display:block;font-size:1.25rem}.mnav button.on{color:var(--g);font-weight:600}
 .top{padding:14px 16px}.pg{padding:16px 14px 100px}.top h1{font-size:1.4rem}
 .k4{grid-template-columns:1fr 1fr}.c2,.c3{grid-template-columns:1fr}
 .tbl-d{display:none}.cards-m{display:block}
 .cm{grid-template-columns:1fr;gap:6px}.cd div{min-width:0;padding:6px 8px}.cd{gap:5px}
 .mwho{display:flex;margin-top:8px;background:var(--soft);border-radius:10px;padding:3px}
 .mwho button{flex:1;border:0;background:none;padding:6px;border-radius:8px;font:inherit;font-size:.8rem}.mwho button.on{background:#fff;font-weight:500}
 .mc{padding:12px 0;border-bottom:1px solid #eee5d4}.mc .m{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center;font-size:.76rem;color:var(--mut)}
}
</style>
</head>
<body>

<div id="login" hidden>
  <h2>Gestão do casamento</h2>
  <div style="color:var(--mut);font-size:13px">Lais & Willian · 12/12/2026</div>
  <input id="senha" type="password" placeholder="Senha" autocomplete="current-password">
  <div id="err"></div>
  <button id="entrar">Entrar</button>
</div>
<div id="toast"></div>
<div id="app" hidden></div>

<script>
var D=null,TAB='home',VER='casal',COMTXT=[],RECENT={},CLOSED={};
var F={resp:'Todos',st:'Abertas',cat:'',view:'tabela',cq:'',cp:'',cs:'',tipo:'',ps:'',pf:'',fsit:''};
var CORES={'Dani':'#7f8c73','Willian':'#a8744c','Lais':'#A98F6B','Casal':'#3d352c'};
var cor=function(r){return CORES[r]||'#6B6153'};
var $=function(s){return document.querySelector(s)};
var brl=function(n){n=Number(n)||0;var s=Math.abs(Math.round(n)).toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g,'.');return (n<0?'-':'')+'R$ '+s};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var hoje=function(){var d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())};
var pd=function(s){if(!s)return null;var p=String(s).substring(0,10).split('-');return new Date(+p[0],+p[1]-1,+p[2])};
var dias=function(s){var d=pd(s);return d?Math.round((d-hoje())/864e5):null};
var fd=function(s){var d=pd(s);return d?('0'+d.getDate()).slice(-2)+'/'+('0'+(d.getMonth()+1)).slice(-2):''};
var DSEM=['dom','seg','ter','qua','qui','sex','sáb'];
function uniq(a){return a.filter(function(v,i,x){return v&&x.indexOf(v)===i})}
function sel(id,label,opts,val){return '<select id="'+id+'"><option value="">'+label+'</option>'+opts.map(function(o){return '<option'+(val===o?' selected':'')+'>'+esc(o)+'</option>'}).join('')+'</select>'}
function chip(txt,c){return '<span class="chip" style="background:'+c+'">'+esc(txt)+'</span>'}
function resp(r){return chip(r,cor(r))}

/* ---------- regras de situação ---------- */
function tarefas(){return (D.tarefas||[]).filter(function(t){return t['Tarefa']})}
function situacaoT(t){
  if(t['Status']==='Feito')return'Feito';
  var d=dias(t['Prazo']);if(d===null)return'Sem prazo';
  return d<0?'ATRASADA':d<=7?'Perto':'No prazo';
}
function sitChip(t){
  var s=situacaoT(t);
  if(s==='Feito')return chip('Concluída','#627a53');
  if(s==='ATRASADA')return chip('Atrasada','#b0533f');
  var d=dias(t['Prazo']);
  if(s==='Perto')return chip(d<=3?'Urgente':'Perto do prazo',d<=3?'#b0533f':'#a8744c');
  return chip(s==='Sem prazo'?'Sem prazo':'No prazo','#6B6153');
}
function abertas(r){return tarefas().filter(function(t){return t['Status']!=='Feito'&&(!r||t['Responsável']===r)}).sort(function(a,b){return String(a['Prazo']||'9').localeCompare(String(b['Prazo']||'9'))})}
function situacaoP(p){
  if(p['Status']==='Pago')return'Pago';
  var d=dias(p['Vencimento']);if(d===null)return'Sem data';
  return d<0?'ATRASADO':d<=14?'Vence em até 14 dias':'No prazo';
}

/* ---------- dados / login ---------- */
async function carregar(){
  RECENT={};
  try{
    var r=await fetch('/api/gestao-dados',{credentials:'same-origin'});
    if(r.status===401){mostrarLogin();return}
    D=await r.json();
  }catch(e){mostrarLogin('Não foi possível carregar. Tente de novo em instantes.');return}
  if(!D.ok){mostrarLogin('Não foi possível ler a planilha agora. Tente de novo.');return}
  if(D.perfil==='dani')VER='dani';
  $('#login').hidden=true;$('#app').hidden=false;render();
}
function mostrarLogin(msg){$('#app').hidden=true;$('#login').hidden=false;$('#err').textContent=msg||'';$('#senha').focus()}
async function entrar(){
  $('#err').textContent='';
  var r=await fetch('/api/gestao-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({senha:$('#senha').value})});
  var j=await r.json().catch(function(){return{}});
  if(r.ok&&j.ok){$('#senha').value='';carregar()}else{$('#err').textContent=j.erro||'Erro ao entrar.'}
}
function toast(m,undo){var t=$('#toast');t.innerHTML='<span>'+esc(m)+'</span>'+(undo?' <button id="undo" style="margin-left:10px;background:#fff;color:#2d2820;border:0;border-radius:999px;padding:3px 10px;cursor:pointer;font:inherit">Desfazer</button>':'');
  t.style.display='block';var u=t.querySelector('#undo');if(u)u.onclick=function(){t.style.display='none';undo()};clearTimeout(toast.t);toast.t=setTimeout(function(){t.style.display='none'},undo?6000:2500)}
async function marcar(el){
  var p=el.dataset.chk.split('|'),aba=p[0],id=p[1],feito=el.checked;
  var lista=aba==='Tarefas'?D.tarefas:D.comunicacao;
  var it=lista.filter(function(x){return String(x['ID'])===id})[0];if(!it)return;
  if(feito){
    var nome=aba==='Tarefas'?it['Tarefa']:it['Ação'];
    if(!window.confirm((aba==='Tarefas'?'Marcar como concluída?':'Marcar como enviado?')+'\n\n'+String(nome).split('\n')[0])){el.checked=false;return}
  }
  var antes={s:it['Status'],em:it['Atualizado em'],por:it['Atualizado por']};
  it['Status']=feito?(aba==='Tarefas'?'Feito':'Enviado'):'A fazer';
  if(aba==='Tarefas'){it['Atualizado em']=new Date().toISOString().substring(0,10);it['Atualizado por']='Painel · '+D.perfil}
  RECENT[aba+'|'+id]=true;
  render();
  try{
    var r=await fetch('/api/gestao-marcar',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({aba:aba,id:id,feito:feito})});
    if(r.status===401){mostrarLogin();return}
    var j=await r.json();
    if(!j.ok)throw new Error(j.erro||'erro');
    toast(feito?'Marcado como concluído ✓':'Voltou para "a fazer" ✓',function(){marcar({dataset:{chk:aba+'|'+id},checked:!feito})});
  }catch(e){
    it['Status']=antes.s;it['Atualizado em']=antes.em;it['Atualizado por']=antes.por;render();toast(/permiss/.test(e.message)?e.message:'Não foi possível salvar. Tente de novo.');
  }
}
/* quem pode marcar: o Dani só os itens dele; o casal os de Lais, Willian e Casal (a regra também é imposta na planilha) */
function podeT(dono){var d=String(dono||'').toLowerCase();return D.perfil==='dani'?d==='dani':d!=='dani'}
function podeC(quem){var d=String(quem||'').toLowerCase();if(!d||d==='—')return true;return D.perfil==='dani'?d.indexOf('dani')>-1:d.indexOf('casal')>-1}
function chkT(t){var id=esc(t['ID']),ok=podeT(t['Responsável']);return '<input type="checkbox" class="chk" '+(id&&ok?'data-chk="Tarefas|'+id+'"':'disabled title="'+(ok?'Tarefa sem ID na planilha':'Só '+esc(t['Responsável']||'o responsável')+' pode concluir esta tarefa')+'"')+(t['Status']==='Feito'?' checked':'')+' aria-label="Concluir tarefa">'}
function feitoPor(t){
  if(t['Status']!=='Feito'||!t['Atualizado em'])return '';
  var por=String(t['Atualizado por']||'').replace(/^Painel ·\s*/,'').replace('willianeduardob@gmail.com','Willian');
  return '<small class="mini">concluída em '+fd(t['Atualizado em'])+(por?' · '+esc(por):'')+'</small>';
}
function mini(t){return '<div class="item"><div>'+esc(t['Tarefa'])+'<small>'+esc(t['Responsável'])+' · '+fd(t['Prazo'])+' · '+esc(t['Categoria'])+'</small></div>'+sitChip(t)+'</div>'}
function miniChk(t){return '<div class="item"><div style="display:flex;gap:12px;align-items:center">'+chkT(t)+'<div>'+esc(t['Tarefa'])+'<small>'+fd(t['Prazo'])+' · '+esc(t['Categoria'])+'</small></div></div>'+sitChip(t)+'</div>'}

/* ---------- derivados ---------- */
function fin(){
  var o=D.orcamento||{};
  var teto=Number(o['Teto do orçamento (R$)'])||0,tot=Number(o['Total previsto, todos os itens (R$)'])||0,pago=Number(o['Já pago (R$)'])||0,dif=Number(o['Diferença para o teto (R$), negativo = acima'])||(teto-tot);
  var g={};(D.pagamentos||[]).forEach(function(p){var s=p['Status']||'Outros';g[s]=(g[s]||0)+(Number(p['Valor (R$)'])||0)});
  return {teto:teto,tot:tot,pago:pago,dif:dif,g:g,pct:teto?Math.round(tot/teto*100):0};
}
function rsvp(){var e=D.extra&&D.extra.conv;return e||null}

/* ---------- views ---------- */
function vHome(){
  var A=abertas(),urg=A.filter(function(t){var d=dias(t['Prazo']);return d!==null&&d<=7});
  var f=fin(),c=rsvp();
  var k='<div class="grid k4">'+
   '<div class="card kpi"><b class="'+(f.pct>100?'gold':'green')+'">'+f.pct+'%</b><span>Orçamento: '+brl(f.tot)+' de '+brl(f.teto)+'</span></div>'+
   '<div class="card kpi"><b class="'+(urg.length?'red':'green')+'">'+urg.length+'</b><span>tarefas atrasadas ou com prazo em 7 dias</span></div>'+
   '<div class="card kpi"><b class="green">'+(c?c.confirmados:'—')+(c?'<small style="font-size:1rem;color:var(--mut)"> /'+c.total+'</small>':'')+'</b><span>confirmados · RSVP até 31/10</span></div>'+
   '<div class="card kpi"><b>'+brl(f.pago)+'</b><span>já pago</span></div></div>';
  var semC=(D.fornecedores||[]).filter(function(x){return /^n/i.test(String(x['Contrato assinado?']||''))&&Number(x['Valor previsto (R$)'])>0});
  var semV=semC.reduce(function(s,x){return s+(Number(x['Valor previsto (R$)'])||0)},0);
  var pa=(D.pagamentos||[]).filter(function(p){return situacaoP(p)==='ATRASADO'});
  var riscos=[];
  if(semC.length)riscos.push(['Sem contrato assinado: '+semC.map(function(x){return x['Fornecedor']}).join(', '),brl(semV)+' em acordo verbal, '+(f.tot?Math.round(semV/f.tot*100):0)+'% do orçamento','Alto','#b0533f']);

function vCrono(){
  var arr=(D.cronograma||[]).slice().sort(function(a,b){return String(a['Data']).localeCompare(String(b['Data']))});
  var tipos=uniq(arr.map(function(m){return m['Tipo']}));
  var fl=arr.filter(function(m){return !F.tipo||m['Tipo']===F.tipo});
  return '<div class="filters">'+sel('ft','Todos os tipos',tipos,F.tipo)+'</div><div class="card"><h2>Linha do tempo até 12/12</h2><div class="lt">'+fl.map(function(m){var d=dias(m['Data']);return '<div class="lm '+(d<0?'past':d<=7?'near':'')+'"><i></i><b>'+fd(m['Data'])+'</b><span>'+esc(m['Marco'])+'</span><small>'+(d<0?'passou':d===0?'hoje':'em '+d+' dias')+'</small></div>'}).join('')+'</div></div>'+
   '<div class="card"><table><thead><tr><th>Data</th><th>Marco</th><th>Tipo</th><th>Quando</th></tr></thead><tbody>'+fl.map(function(m){var d=dias(m['Data']);return '<tr style="'+(d!==null&&d<0?'opacity:.5':'')+'"><td>'+fd(m['Data'])+'</td><td>'+esc(m['Marco'])+'<small class="mini">'+esc(m['Fornecedor ou fonte'])+'</small></td><td>'+esc(m['Tipo'])+'</td><td>'+(d===null?'':d<0?'passou':d===0?'hoje':'em '+d+' d')+'</td></tr>'}).join('')+'</tbody></table></div>';
}

function vEq(){
  var dn=tarefas().filter(function(t){return t['Responsável']==='Dani'}),fe=dn.filter(function(t){return t['Status']==='Feito'}),o=abertas('Dani');
  var at=o.filter(function(t){return dias(t['Prazo'])<0}).length,pe=o.filter(function(t){var d=dias(t['Prazo']);return d>=0&&d<=7}).length;
  var rec=tarefas().filter(function(t){return t['Status']==='Feito'&&t['Atualizado em']}).sort(function(a,b){return String(b['Atualizado em']).localeCompare(String(a['Atualizado em']))}).slice(0,6);
  var ok=function(v){var s=String(v||'');return /^s/i.test(s)?'✅':/^n/i.test(s)?'⬜':'—'};
  return '<div class="grid k4"><div class="card kpi"><b>'+fe.length+'/'+dn.length+'</b><span>tarefas do Dani concluídas</span></div><div class="card kpi"><b class="'+(at?'red':'green')+'">'+at+'</b><span>atrasadas</span></div><div class="card kpi"><b class="gold">'+pe+'</b><span>vencem em 7 dias</span></div><div class="card kpi"><b>'+o.length+'</b><span>em aberto</span></div></div>'+
   '<div class="grid c2"><div><div class="card"><h2>Próximas do Dani</h2>'+o.slice(0,8).map(mini).join('')+'</div><div class="card"><h2>Última atividade no painel</h2>'+(rec.map(function(t){return '<div class="item"><div>'+esc(t['Tarefa'])+feitoPor(t)+'</div></div>'}).join('')||'<div class="mini">Nenhuma tarefa concluída pelo painel ainda.</div>')+'</div></div>'+
   '<div class="card"><h2>Contratos e grupos de WhatsApp</h2>'+(D.fornecedores||[]).map(function(x){return '<div class="item"><div>'+esc(x['Fornecedor'])+'<small>'+esc(x['Situação'])+'</small></div><span style="font-size:.8rem">contrato '+ok(x['Contrato assinado?'])+' · grupo '+ok(x['Grupo de WhatsApp criado?'])+'</span></div>'}).join('')+'</div></div>';
}

/* ---------- casca ---------- */
var NAV_C=[['home','🏠','Painel'],['check','✅','Tarefas'],['com','💬','Comunicação'],['forn','💰','Fornecedores'],['pres','🎁','Presentes'],['crono','🗓️','Cronograma'],['fds','📅','Fim de semana'],['eq','👤','Equipe']];
var NAV_D=[['home','☀️','Hoje'],['check','✅','Tarefas'],['com','💬','Comunicação'],['forn','💰','Fornecedores'],['crono','🗓️','Cronograma'],['fds','📅','Fim de semana']];
function render(){
  var nav=VER==='casal'?NAV_C:NAV_D;
  if(!nav.filter(function(n){return n[0]===TAB}).length)TAB='home';
  var V={home:VER==='casal'?vHome:vHoje,check:vCheck,com:vCom,forn:vForn,pres:vPres,crono:vCrono,fds:vFds,eq:vEq};
  var titulo=nav.filter(function(n){return n[0]===TAB})[0][2];
  var ts=tarefas(),fe=ts.filter(function(t){return t['Status']==='Feito'}).length;
  var atr=ts.filter(function(t){return situacaoT(t)==='ATRASADA'}).length;
  var troca=D.perfil!=='dani';
  var sw=function(cls){return troca?'<div class="'+cls+'"><button class="'+(VER==='casal'?'on':'')+'" data-ver="casal">Casal</button><button class="'+(VER==='dani'?'on':'')+'" data-ver="dani">Ver como Dani</button></div>':''};
  $('#app').innerHTML='<div class="shell"><aside><div class="brand">Lais & Willian<small>12/12/2026 · Araucária Village</small></div>'+sw('who')+
   nav.map(function(n){return '<button class="nv '+(TAB===n[0]?'on':'')+'" data-t="'+n[0]+'">'+n[1]+' '+n[2]+(n[0]==='check'&&atr?'<i>'+atr+'</i>':'')+'</button>'}).join('')+
   '<div class="foot">Fonte: planilha de gestão<br>atualizado '+new Date(D.geradoEm).toLocaleString('pt-BR')+'<br><button id="atualizar">Atualizar</button><button id="sair">Sair</button></div></aside>'+
   '<div class="main"><div class="top"><div><h1>'+titulo+'</h1><div class="sub">'+fe+' de '+ts.length+' tarefas concluídas</div>'+sw('mwho')+'</div>'+
   '<div class="cd" id="cd"><div><b>--</b><small>dias</small></div><div><b>--</b><small>horas</small></div><div><b>--</b><small>min</small></div><div><b>--</b><small>seg</small></div></div></div>'+
   '<div class="pg">'+V[TAB]()+'</div></div></div>'+
   '<div class="mnav">'+nav.map(function(n){return '<button class="'+(TAB===n[0]?'on':'')+'" data-t="'+n[0]+'"><span>'+n[1]+'</span>'+n[2]+'</button>'}).join('')+'<button id="atualizar2"><span>🔄</span>Atualizar</button></div>';
  tick();
}
function tick(){
  var el=document.getElementById('cd');if(!el||!D)return;
  var alvo=new Date(String(D.dataEvento).substring(0,10)+'T16:30:00-03:00');
  var s=Math.max(0,Math.floor((alvo-new Date())/1000));
  var v=[Math.floor(s/86400),Math.floor(s%86400/3600),Math.floor(s%3600/60),s%60];
  var bs=el.querySelectorAll('b');for(var i=0;i<4;i++)bs[i].textContent=String(v[i]).padStart(2,'0');
}
setInterval(tick,1000);

document.addEventListener('click',function(e){
  var b;
  if(b=e.target.closest('[data-t]')){TAB=b.dataset.t;render();scrollTo(0,0);return}
  if(b=e.target.closest('[data-ver]')){VER=b.dataset.ver;TAB='home';render();return}
  if(b=e.target.closest('[data-f]')){var p=b.dataset.f.split('|');F[p[0]]=p[1];render();return}
  if(b=e.target.closest('[data-copy]')){var tx=COMTXT[+b.dataset.copy]||'';
    (navigator.clipboard?navigator.clipboard.writeText(tx):Promise.reject()).catch(function(){var ta=document.createElement('textarea');ta.value=tx;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}).then(function(){var o=b.textContent;b.textContent='Copiado ✓';setTimeout(function(){b.textContent=o},1500)});return}
  if(b=e.target.closest('[data-wa]')){window.open('https://wa.me/?text='+encodeURIComponent(COMTXT[+b.dataset.wa]||''),'_blank');return}
  if(e.target.closest('#atualizar')||e.target.closest('#atualizar2')){carregar();return}
  if(e.target.closest('#sair')){fetch('/api/gestao-login',{method:'DELETE'}).then(mostrarLogin);return}
});
document.addEventListener('change',function(e){
  if(e.target.classList&&e.target.classList.contains('chk')){marcar(e.target);return}
  var m={fc:'cat',ft:'tipo',fps:'ps',fsit:'fsit',cq:'cq',cp:'cp',cs:'cs'};
  if(m[e.target.id]){F[m[e.target.id]]=e.target.value;render()}
});
$('#entrar').onclick=entrar;
$('#senha').addEventListener('keydown',function(e){if(e.key==='Enter')entrar()});
carregar();
</script>
</body>
</html>
